name: Sync Prompt Optimizer

# Keeps public/tools/prompt-optimizer/index.html in sync with the latest version
# from gbxcaillin/promptingskills, re-applying the site-integration edits.
# Runs daily and on demand; commits to main only when the tool has changed,
# which then triggers the normal Cloudflare Pages deploy.

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-prompt-optimizer
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync tool from Promptingskills
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-prompt-optimizer.mjs

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain public/tools/prompt-optimizer/index.html)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/tools/prompt-optimizer/index.html
            git commit -m "Sync Prompt Optimizer from Promptingskills"
            git push
            echo "Prompt Optimizer updated."
          else
            echo "No changes to sync."
          fi
